{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>Remove Manufacturer <a href="{% url 'taxi:manufacturer-list' %}">Back</a></h1>
  <p>
    Are you sure you want to remove the Manufacturer: {{ manufacturer.name }}
    <a class="btn btn-primary" href="{% url 'taxi:manufacturer-list' %}">Cancel</a>
  </p>
  <form action="" method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <input type="submit" value="Confirm" class="btn btn-danger">
  </form>
{% endblock %}
